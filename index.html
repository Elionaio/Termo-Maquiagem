<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Termo de Responsabilidade</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
  font-family: Arial;
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

h2 { text-align: center; }

input, textarea {
  border: none;
  border-bottom: 1px solid black;
  width: 100%;
  margin-top: 5px;
}

textarea { height: 60px; }

.row { display: flex; gap: 10px; }

.radio-group { display: flex; gap: 20px; margin-top: 10px; }

.check-group label { display: block; margin-top: 8px; }

button {
  margin-top: 15px;
  padding: 10px;
  width: 100%;
  background: black;
  color: white;
  border: none;
}

canvas {
  border: 1px solid black;
  width: 100%;
  height: 150px;
  margin-top: 10px;
}
</style>
</head>

<body>

<h2>📝 TERMO DE CONSENTIMENTO - MAQUIAGEM</h2>

<form id="form">

<input type="text" id="nome" placeholder="Nome" required>

<div class="row">
  <input type="date" id="data" required>
  <input type="time" id="hora" required>
</div>

<p><b>Sobre o Atendimento</b></p>
<textarea id="alergia"></textarea>

<p><b>Imagem</b></p>
<div class="radio-group">
  <label><input type="radio" name="imagem" value="Autoriza"> Autoriza</label>
  <label><input type="radio" name="imagem" value="Não autoriza"> Não autoriza</label>
</div>

<p><b>Confirmações</b></p>
<div class="check-group">
  <label><input type="checkbox" class="check"> Comparecerei no horário</label>
  <label><input type="checkbox" class="check"> Informei alergias</label>
  <label><input type="checkbox" class="check"> Estou ciente do procedimento</label>
</div>

<p><b>Assinatura:</b></p>
<canvas id="assinaturaCanvas"></canvas>
<button type="button" onclick="limpar()">Limpar assinatura</button>

<button type="submit">Gerar e Enviar</button>

</form>

<!-- PDF -->
<div id="pdf" style="display:none; padding:30px;">

<h2 style="text-align:center;">TERMO DE CONSENTIMENTO</h2>

<p><b>Nome:</b> <span id="p_nome"></span></p>
<p><b>Data:</b> <span id="p_data"></span></p>
<p><b>Hora:</b> <span id="p_hora"></span></p>

<hr>

<p><b>Alergias:</b></p>
<p id="p_alergia"></p>

<hr>

<p><b>Imagem:</b> <span id="p_imagem"></span></p>

<hr>

<ul id="p_checks"></ul>

<hr>

<img id="p_assinatura" style="width:200px;">

</div>

<script>
// ===== ASSINATURA CORRIGIDA =====
const canvas = document.getElementById("assinaturaCanvas");
const ctx = canvas.getContext("2d");

function ajustarCanvas(){
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.offsetWidth * ratio;
  canvas.height = canvas.offsetHeight * ratio;
  ctx.scale(ratio, ratio);
}

ajustarCanvas();

let desenhando = false;

function getPos(e){
  const rect = canvas.getBoundingClientRect();
  return {
    x: e.touches[0].clientX - rect.left,
    y: e.touches[0].clientY - rect.top
  };
}

canvas.addEventListener("touchstart", (e)=>{
  desenhando = true;
  const pos = getPos(e);
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
});

canvas.addEventListener("touchmove", (e)=>{
  if(!desenhando) return;
  const pos = getPos(e);

  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";

  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
});

canvas.addEventListener("touchend", ()=>{
  desenhando = false;
});

// limpar REAL
function limpar(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.beginPath();
}

// ===== SUBMIT =====
document.getElementById("form").addEventListener("submit", async function(e){
e.preventDefault();

const nome = document.getElementById("nome").value;
const data = document.getElementById("data").value;
const hora = document.getElementById("hora").value;
const alergia = document.getElementById("alergia").value;

const imagem = document.querySelector('input[name="imagem"]:checked');
const checks = document.querySelectorAll(".check");

if(!imagem){ alert("Selecione imagem"); return; }

let ok = true;
checks.forEach(c=>{ if(!c.checked) ok=false; });
if(!ok){ alert("Confirme tudo"); return; }

// assinatura
const assinaturaImg = canvas.toDataURL();

// preencher
p_nome.innerText = nome;
p_data.innerText = data;
p_hora.innerText = hora;
p_alergia.innerText = alergia || "Nenhuma";
p_imagem.innerText = imagem.value;
p_assinatura.src = assinaturaImg;

p_checks.innerHTML = "";
checks.forEach(c=>{
  let li = document.createElement("li");
  li.innerText = c.parentElement.innerText;
  p_checks.appendChild(li);
});

// PDF
const element = document.getElementById("pdf");
element.style.display = "block";

const worker = html2pdf().from(element).toPdf();
const pdfBlob = await worker.outputPdf("blob");

await worker.save();

element.style.display = "none";

// ===== WHATSAPP AUTOMÁTICO =====
const numero = "553196362001"; // SEU NÚMERO

const mensagem = `Olá, segue meu termo preenchido:

Nome: ${nome}
Data: ${data}
Hora: ${hora}`;

window.open(`https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`, "_blank");

});
</script>

</body>
</html>
