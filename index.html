<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Termo de Responsabilidade</title>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

  <style>
    body {
      font-family: Arial;
      max-width: 600px;
      margin: auto;
      color: #000;
    }
    input, textarea {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
    }
    button {
      padding: 10px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>📝 Termo de Responsabilidade - Maquiagem</h2>
  <hr>

  <form id="form">

    <label>Nome:</label>
    <input type="text" name="nome" required>

    <label>Data:</label>
    <input type="date" name="data" required>

    <label>Alergia:</label>
    <textarea name="alergia" placeholder="Descreva ou escreva 'Nenhuma'"></textarea>

    <p>
      Declaro que estou ciente dos procedimentos e autorizo o serviço de maquiagem.
    </p>

    <button type="submit">Enviar Termo</button>

  </form>

  <script>
    (function(){
      emailjs.init("SUA_PUBLIC_KEY"); // <-- coloca aqui
    })();

    document.getElementById("form").addEventListener("submit", function(e) {
      e.preventDefault();

      emailjs.sendForm(
        "SEU_SERVICE_ID",   // <-- aqui
        "SEU_TEMPLATE_ID",  // <-- aqui
        this
      )
      .then(function() {
        alert("Termo enviado com sucesso!");
      }, function(error) {
        alert("Erro ao enviar: " + JSON.stringify(error));
      });
    });
  </script>

</body>
</html>
