<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Termo de Responsabilidade</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
  font-family: Arial;
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

h2 { text-align: center; }

input, textarea {
  border: none;
  border-bottom: 1px solid black;
  width: 100%;
  margin-top: 5px;
}

textarea { height: 60px; }

.row { display: flex; gap: 10px; }
.row div { flex: 1; }

.radio-group { display: flex; gap: 20px; margin-top: 10px; }

.check-group label {
  display: block;
  margin-top: 8px;
}

button {
  margin-top: 20px;
  padding: 10px;
  width: 100%;
  background: black;
  color: white;
  border: none;
}
</style>
</head>

<body>

<h2>📝 TERMO DE RESPONSABILIDADE - MAQUIAGEM</h2>

<form id="form">

<input type="text" id="nome" placeholder="Nome" required>

<div class="row">
  <div><input type="date" id="data" required></div>
  <div><input type="time" id="hora" required></div>
</div>

<textarea id="alergia" placeholder="Alergias"></textarea>

<p><b>Imagem</b></p>
<div class="radio-group">
  <label><input type="radio" name="imagem" value="Autoriza"> Autoriza</label>
  <label><input type="radio" name="imagem" value="Não autoriza"> Não autoriza</label>
</div>

<p><b>Confirmações</b></p>
<div class="check-group">
  <label><input type="checkbox" class="check"> Comparecerei no horário</label>
  <label><input type="checkbox" class="check"> Informei alergias</label>
  <label><input type="checkbox" class="check"> Ciente de riscos</label>
  <label><input type="checkbox" class="check"> Autorizo procedimento</label>
  <label><input type="checkbox" class="check"> Isento profissional</label>
</div>

<input type="text" id="assinatura" placeholder="Assinatura" required>

<button type="submit">Enviar Termo</button>

</form>

<!-- PDF -->
<div id="pdf" style="display:none; padding:20px;">

<h2>TERMO DE RESPONSABILIDADE</h2>

<p><b>Nome:</b> <span id="p_nome"></span></p>
<p><b>Data:</b> <span id="p_data"></span></p>
<p><b>Hora:</b> <span id="p_hora"></span></p>

<p><b>Alergias:</b> <span id="p_alergia"></span></p>
<p><b>Imagem:</b> <span id="p_imagem"></span></p>

<p><b>Confirmações:</b></p>
<ul id="p_checks"></ul>

<p><b>Assinatura:</b> <span id="p_assinatura"></span></p>

</div>

<script>
document.getElementById("form").addEventListener("submit", function(e){
e.preventDefault();

const nome = document.getElementById("nome").value;
const data = document.getElementById("data").value;
const hora = document.getElementById("hora").value;
const alergia = document.getElementById("alergia").value;
const assinatura = document.getElementById("assinatura").value;
const imagem = document.querySelector('input[name="imagem"]:checked');
const checks = document.querySelectorAll(".check");

if(!imagem){ alert("Selecione imagem"); return; }

let ok = true;
checks.forEach(c=>{ if(!c.checked) ok=false; });
if(!ok){ alert("Aceite todas as confirmações"); return; }

// preencher PDF
p_nome.innerText = nome;
p_data.innerText = data;
p_hora.innerText = hora;
p_alergia.innerText = alergia || "Nenhuma";
p_imagem.innerText = imagem.value;
p_assinatura.innerText = assinatura;

// lista checks
p_checks.innerHTML = "";
checks.forEach(c=>{
let li = document.createElement("li");
li.innerText = c.parentElement.innerText;
p_checks.appendChild(li);
});

const element = document.getElementById("pdf");
element.style.display = "block";

html2pdf().from(element).save("termo.pdf");

element.style.display = "none";

// abrir whatsapp
const numero = "5531SEUNUMERO"; // coloca seu número

const msg = `Novo termo de ${nome}`;

window.open(`https://wa.me/${numero}?text=${encodeURIComponent(msg)}`, "_blank");

});
</script>

</body>
</html>
